extends:
  - "${BASH_DEV_ENV_ROOT_DIR}/src/_commandDefinitions/upgradeGithubRelease.yaml"

vars:
  SRC_FILE_PATH: src/_installScripts/GithubReleases/ActionLint-binary.yaml

compilerConfig:
  targetFile: "${BASH_DEV_ENV_ROOT_DIR}/installScripts/ActionLint"
  relativeRootDirBasedOnTargetDir: ..
binData:
  commands:
    default:
      functionName: ActionLintCommand
      version: "3.1"
      copyrightBeginYear: 2026
      definitionFiles:
        90: ${BASH_DEV_ENV_ROOT_DIR}/src/_installScripts/GithubReleases/ActionLint.sh
      commandName: ActionLint
